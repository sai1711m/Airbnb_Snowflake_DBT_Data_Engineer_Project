version: 2

models:
  - name: obt
    description: One Big Table combining bookings, listings, and hosts
    columns:
      - name: booking_id
        description: Primary key
        tests:
          - unique
          - not_null
      - name: listing_id
        tests:
          - not_null
      - name: host_id
        tests:
          - not_null
      - name: total_price
        tests:
          - not_null
      - name: booking_status
        tests:
          - not_null
      - name: property_type
        tests:
          - not_null
      - name: room_type
        tests:
          - not_null
      - name: city
        tests:
          - not_null
      - name: country
        tests:
          - not_null
      - name: host_name
        tests:
          - not_null
      - name: is_superhost
        tests:
          - not_null

  - name: fact
    description: Fact table for analytics
    columns:
      - name: booking_id
        description: Primary key
        tests:
          - not_null
      - name: listing_id
        tests:
          - not_null
      - name: host_id
        tests:
          - not_null
      - name: total_price
        tests:
          - not_null
      - name: accommodates
        tests:
          - not_null
      - name: price_per_night
        tests:
          - not_null
      - name: response_rate
        tests:
          - not_null
