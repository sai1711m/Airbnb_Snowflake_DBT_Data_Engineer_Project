version: 2

sources:
  - name: staging
    database: AIRBNB
    schema: staging
    freshness:
      warn_after: {count: 12, period: hour}
      error_after: {count: 24, period: hour}
    loaded_at_field: created_at
    tables:
      - name: listings
        description: Raw listings data
        columns:
          - name: listing_id
            description: Primary key
            tests:
              - unique
              - not_null
          - name: host_id
            tests:
              - not_null
          - name: price_per_night
            tests:
              - not_null

      - name: bookings
        description: Raw bookings data
        columns:
          - name: booking_id
            description: Primary key
            tests:
              - unique
              - not_null
          - name: listing_id
            tests:
              - not_null
          - name: booking_amount
            tests:
              - not_null

      - name: hosts
        description: Raw hosts data
        columns:
          - name: host_id
            description: Primary key
            tests:
              - unique
              - not_null
          - name: host_name
            tests:
              - not_null