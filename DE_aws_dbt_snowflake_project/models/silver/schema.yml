version: 2

models:
  - name: silver_bookings
    description: Cleaned bookings with calculated total price
    columns:
      - name: booking_id
        description: Primary key
        tests:
          - unique
          - not_null
      - name: listing_id
        description: Foreign key to listings
        tests:
          - not_null
          - relationships:
              to: ref('silver_listings')
              field: listing_id
      - name: booking_date
        tests:
          - not_null
      - name: total_price
        description: Total price including fees
        tests:
          - not_null
      - name: booking_status
        tests:
          - not_null
          - accepted_values:
              values: ['confirmed', 'pending', 'cancelled', 'completed']
      - name: created_at
        tests:
          - not_null

  - name: silver_hosts
    description: Cleaned hosts with response rate quality
    columns:
      - name: host_id
        description: Primary key
        tests:
          - unique
          - not_null
      - name: host_name
        tests:
          - not_null
      - name: host_since
        tests:
          - not_null
      - name: response_rate
        tests:
          - not_null
      - name: is_superhost
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
      - name: response_rate_quality
        tests:
          - not_null
          - accepted_values:
              values: ['VERY GOOD', 'GOOD', 'AVERAGE', 'POOR']
      - name: created_at
        tests:
          - not_null

  - name: silver_listings
    description: Cleaned listings with price tags
    columns:
      - name: listing_id
        description: Primary key
        tests:
          - unique
          - not_null
      - name: host_id
        description: Foreign key to hosts
        tests:
          - not_null
          - relationships:
              to: ref('silver_hosts')
              field: host_id
      - name: property_type
        tests:
          - not_null
      - name: room_type
        tests:
          - not_null
      - name: city
        tests:
          - not_null
      - name: country
        tests:
          - not_null
      - name: accommodates
        tests:
          - not_null
      - name: price_per_night
        tests:
          - not_null
      - name: created_at
        tests:
          - not_null
